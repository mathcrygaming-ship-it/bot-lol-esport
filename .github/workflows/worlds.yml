name: BOT LOL ESPORT - Test Donnees Worlds

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester-worlds:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le code
        run: python -m py_compile bot.py

      - name: Tester calendrier et classement Worlds
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          base = "https://api.citoapi.com/api/v1/lol/leagues/lol-worlds"

          
          endpoints = [
              ("CLASSEMENT WORLDS PAR DEFAUT", base + "/standings"),
              (
                  "CLASSEMENT WORLDS 2026",
                  base + "/standings?tournamentId=lol-worlds_2026"
              ),
          ]


          for label, url in endpoints:
              print("\n===", label, "===")
              request = urllib.request.Request(
                  url,
                  headers={
                      "x-api-key": key,
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))

                  print("HTTP :", response.status)
                  print("Succes API :", payload.get("success", "non precise")
                        if isinstance(payload, dict) else "format liste")

                  if isinstance(payload, dict):
                      data = payload.get("data", payload.get("matches", payload))
                  else:
                      data = payload

                  if isinstance(data, list):
                      print("Elements retournes :", len(data))
                      print(json.dumps(data[:3], ensure_ascii=False, indent=2)[:6000])
                  else:
                      print("Structure recue :")
                      print(json.dumps(data, ensure_ascii=False, indent=2)[:6000])

              except urllib.error.HTTPError as error:
                  print("ERREUR HTTP :", error.code)
                  print(error.read().decode("utf-8", errors="replace")[:2000])
              except Exception as error:
                  print("ERREUR :", type(error).__name__, str(error))

          print("\nTest termine. Aucun message Discord envoye.")
          PY
