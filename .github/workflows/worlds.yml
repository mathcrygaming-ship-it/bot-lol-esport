name: BOT LOL ESPORT - Diagnostic Calendrier

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostiquer la reponse Cito
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from collections import Counter

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          url = "https://api.citoapi.com/api/v1/lol/leagues/lol-worlds/schedule"

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(
                      response.read().decode("utf-8")
                  )
                  print("HTTP :", response.status)

          except urllib.error.HTTPError as error:
              print("ERREUR HTTP :", error.code)
              print(
                  error.read().decode(
                      "utf-8", errors="replace"
                  )[:3000]
              )
              raise SystemExit(1)

          data = payload.get("data", {})
          events = data.get("events", [])

          print("Nombre total d'evenements :", len(events))
          print("Repartition des etats :")
          print(json.dumps(
              dict(Counter(
                  event.get("state", "inconnu")
                  for event in events
              )),
              ensure_ascii=False,
              indent=2
          ))

          for state in ("completed", "inProgress"):
              matches = [
                  event for event in events
                  if str(event.get("state", "")).lower()
                  == state.lower()
              ]

              print(
                  f"\n=== MATCHS {state.upper()} : "
                  f"{len(matches)} ==="
              )

              for match in matches[:10]:
                  teams = match.get("teams", [])

                  teams_text = " vs ".join(
                      f"{team.get('name', '?')} "
                      f"({team.get('score', '?')})"
                      for team in teams
                  )

                  print(
                      match.get("startTime"),
                      "|",
                      match.get("blockName"),
                      "|",
                      teams_text,
                      "| ID:",
                      match.get("matchId")
                  )

          print(
              "\nDiagnostic termine. "
              "Aucun message Discord envoye."
          )
          PY
