name: BOT LOL ESPORT - Verification Worlds 2026

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-worlds:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le code Python
        run: python -m py_compile bot.py

      - name: Interroger le calendrier Worlds
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("ERREUR : secret CITO_API_KEY absent.")

          url = (
              "https://api.citoapi.com/api/v1/lol/schedule/upcoming"
              "?leagueSlug=worlds"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(
                      response.read().decode("utf-8")
                  )

              print("Connexion Cito API : OK")
              print("Code HTTP :", response.status)
              print("Format de la reponse :", type(payload).__name__)

              if isinstance(payload, dict):
                  print("Statut API :", payload.get("success", "non precise"))
                  data = payload.get("data", payload.get("matches", []))
              elif isinstance(payload, list):
                  data = payload
              else:
                  raise SystemExit("Format de reponse inattendu.")

              if not isinstance(data, list):
                  print("La structure des donnees doit etre examinee.")
                  print(json.dumps(payload, ensure_ascii=False)[:3000])
                  raise SystemExit(1)

              print("Matchs retournes :", len(data))

              for match in data[:10]:
                  print(json.dumps(match, ensure_ascii=False)[:1200])

              print("Verification terminee. Aucun message Discord envoye.")

          except urllib.error.HTTPError as error:
              print("Erreur HTTP Cito :", error.code)
              raise SystemExit(1)
          except Exception as error:
              print("Erreur :", type(error).__name__, str(error))
              raise SystemExit(1)
          PY
