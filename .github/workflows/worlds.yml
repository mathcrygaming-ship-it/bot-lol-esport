name: BOT LOL ESPORT - Diagnostic Calendrier

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostiquer la reponse Cito
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          url = "https://api.citoapi.com/api/v1/lol/leagues/lol-worlds/schedule"
          request = urllib.request.Request(
              url,
              headers={"x-api-key": key, "Accept": "application/json"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  print("HTTP :", response.status)
                  print("Taille de la reponse :", len(raw), "caracteres")
                  try:
                      payload = json.loads(raw)
                      print("Type :", type(payload).__name__)
                      if isinstance(payload, dict):
                          print("Cles principales :", list(payload.keys()))
                      print("Reponse brute :")
                      print(json.dumps(
                          payload, ensure_ascii=False, indent=2
                      )[:10000])
                  except json.JSONDecodeError:
                      print(raw[:10000])
          except urllib.error.HTTPError as error:
              print("ERREUR HTTP :", error.code)
              print(error.read().decode("utf-8", errors="replace")[:3000])
              raise SystemExit(1)

          print("\nDiagnostic termine. Aucun message Discord envoye.")
          PY
