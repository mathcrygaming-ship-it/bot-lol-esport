name: BOT LOL ESPORT - Recherche Worlds et LEC

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le code
        run: python -m py_compile bot.py

      - name: Rechercher Worlds et LEC
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          url = "https://api.citoapi.com/api/v1/lol/leagues"
          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if not payload.get("success"):
              raise SystemExit("Cito API n'a pas confirme le succes.")

          leagues = payload.get("data", [])
          print("Nombre total de ligues :", len(leagues))

          for league in leagues:
              searchable = " ".join([
                  str(league.get("name", "")),
                  str(league.get("slug", "")),
                  str(league.get("leagueId", "")),
                  " ".join(str(x) for x in league.get("aliases", []))
              ]).lower()

              if (
                  "worlds" in searchable
                  or "world championship" in searchable
                  or "lec" in searchable
              ):
                  print(json.dumps({
                      "name": league.get("name"),
                      "slug": league.get("slug"),
                      "leagueId": league.get("leagueId"),
                      "isActive": league.get("isActive"),
                      "tournaments": league.get("_count", {}).get("tournaments"),
                      "schedule": league.get("endpoints", {}).get("schedule"),
                      "standings": league.get("endpoints", {}).get("standings")
                  }, ensure_ascii=False))

          print("Recherche terminee. Aucun message Discord envoye.")
          PY
