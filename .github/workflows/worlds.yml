name: BOT LOL ESPORT - Test Detail Match

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester-detail:
    runs-on: ubuntu-latest
    steps:
      - name: Tester le detail du match KC
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          match_id = "lol-match-115660588583171786"
          url = f"https://api.citoapi.com/api/v1/lol/matches/{match_id}"

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  print("HTTP :", response.status)
                  payload = json.loads(raw)
                  print("Reponse API :")
                  print(json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2
                  )[:10000])

          except urllib.error.HTTPError as error:
              print("ERREUR HTTP :", error.code)
              print(error.read().decode(
                  "utf-8", errors="replace"
              )[:3000])

          print("\nTest termine. Aucun message Discord envoye.")
          PY
