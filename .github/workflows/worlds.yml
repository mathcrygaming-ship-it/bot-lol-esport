name: BOT LOL ESPORT - Diagnostic Ligues

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le code
        run: python -m py_compile bot.py

      - name: Examiner les ligues Cito
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          key = os.getenv("CITO_API_KEY")
          url = "https://api.citoapi.com/api/v1/lol/leagues"

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key or "",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))

              print("HTTP :", response.status)
              print("Reponse API :")
              print(json.dumps(payload, ensure_ascii=False, indent=2)[:12000])

              print("\nDiagnostic termine. Aucun message Discord envoye.")

          except Exception as error:
              print("Erreur :", type(error).__name__, str(error))
              raise SystemExit(1)
          PY
