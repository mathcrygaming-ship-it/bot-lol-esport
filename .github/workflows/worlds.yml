name: BOT LOL ESPORT - Verifier planning Worlds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-planning:
    runs-on: ubuntu-latest

    steps:
      - name: Lire et verifier le calendrier Worlds
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          key = os.getenv("CITO_API_KEY")
          if not key:
              raise SystemExit("Secret CITO_API_KEY absent.")

          url = "https://api.citoapi.com/api/v1/lol/leagues/lol-worlds/schedule"
          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          data = payload.get("data", payload)
          events = data.get("events", [])

          print("HTTP : calendrier reçu")
          print("Nombre d'evenements :", len(events))
          print("Fuseau affiche :", "Europe/Paris")
          print("=" * 60)

          paris = ZoneInfo("Europe/Paris")

          def inspect(obj, depth=0):
              if depth > 3:
                  return
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if isinstance(value, (str, int, float)) and any(
                          word in key.lower()
                          for word in ("team", "name", "start", "date", "state", "match", "tournament")
                      ):
                          print(f"{'  ' * depth}{key}: {value}")
                      elif isinstance(value, (dict, list)):
                          inspect(value, depth + 1)
              elif isinstance(obj, list):
                  for item in obj[:8]:
                      inspect(item, depth + 1)

          for index, event in enumerate(events, 1):
              start = event.get("startTime") or event.get("start_time")
              print(f"\n--- EVENEMENT {index} ---")

              if start:
                  try:
                      dt = datetime.fromisoformat(start.replace("Z", "+00:00"))
                      print("Horaire UTC :", dt.isoformat())
                      print("Heure France :", dt.astimezone(paris).strftime("%d/%m/%Y à %H:%M"))
                  except (ValueError, TypeError):
                      print("Horaire brut :", start)
              else:
                  print("Horaire : champ startTime absent")

              inspect(event)

          print("\nFin du controle. Aucun message Discord envoye.")
          PY
